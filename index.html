<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>国风古建 · 城池像素工坊</title>
<link rel="stylesheet" href="css/app.css?v=20261125modular" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">楼</div>
      <div class="brand-text">
        <h1>国风古建像素工坊</h1>
        <p>参数化三维古建 · 正交 2:1 像素等轴出图</p>
      </div>
    </div>
    <a class="btn ghost switch-btn" href="city.html" title="切到城池工坊：造一座城">城池工坊</a>
    <button class="btn switch-btn" id="btnMode" title="切换渲染内核：GPU（WebGL2 硬件光栅）/ CPU（软件光栅）">GPU</button>
    <div class="topbar-actions">
      <div class="dens">
        <label for="densRange">像素密度</label>
        <input type="range" id="densRange" min="8" max="320" step="4" title="拖动即可提高出图密度，细节会跟着变清楚">
        <b id="densVal">40</b><span class="unit">px/m</span>
      </div>
      <button class="btn ghost" id="btnRandom">随机一座</button>
      <button class="btn" id="btnExport">导出 PNG</button>
      <button class="btn" id="btnSheet">导出八向精灵表</button>
      <button class="btn ghost" id="btnZip">导出 ZIP（多向+配方）</button>
      <button class="btn ghost" id="btnSave">保存配方</button>
      <button class="btn ghost" id="btnLoad">载入配方</button>
      <button class="btn ghost" id="btnHelp">说明</button>
    </div>
  </header>

  <div class="main">
    <!-- 左侧参数区 -->
    <aside class="sidebar" id="sidebar">
      <div class="panel-head">
        <span>配方</span>
        <div class="preset-chips" id="presetChips"></div>
      </div>
      <div id="controls"></div>
      <div class="panel-foot">
        <div class="tiny">所有构件均为三维参数化生成；导出的 PNG 可含生成配方（JSON）。</div>
      </div>
    </aside>

    <!-- 画布 -->
    <section class="stage">
      <div class="stage-top">
        <div class="badge">2:1 像素视图</div>
        <div class="badge light" id="camInfo">俯视 30° · 每次旋转 45°</div>
        <div class="spacer"></div>
        <button class="mini" data-view="all" title="全景取景">全景</button>
        <button class="mini" data-view="roof" title="放大到屋面">屋面</button>
        <button class="mini" data-view="facade" title="放大到门窗檐下">门面</button>
        <button class="mini" data-view="base" title="放大到台基踏跺">台基</button>
        <button class="mini" data-view="court" title="放大到院落环境">院落</button>
        <button class="mini" id="rotL" title="逆时针 45°">⟲ 45°</button>
        <button class="mini" id="rotR" title="顺时针 45°">⟳ 45°</button>
        <button class="mini" id="btnAxis" title="转到中轴正立面（旋向 0°，保持当前缩放）">中轴</button>
        <button class="mini" id="btnBuild" title="自下而上逐层落成演示">落成演示</button>
        <button class="mini" id="btnFull">全屏</button>
        <button class="mini" id="btnGrid" title="地面栅格：1 m 一格，5 格加重">网格</button>
        <button class="mini" id="btnCut">剖切：室内外</button>
      </div>
      <div class="stage-cam">
        <div class="cam-title">相机</div>
        <div class="dens cam-ctl" title="Z 轴俯角：从近平视一路拉到俯视">
          <label for="pitchRange">俯角</label>
          <input type="range" id="pitchRange" min="18" max="55" step="1" value="30">
          <b id="pitchVal">30</b><span class="unit">°</span>
        </div>
        <div class="dens cam-ctl" title="透视强度：0 为正交轴测，100% 为人眼透视">
          <label for="perspRange">透视</label>
          <input type="range" id="perspRange" min="0" max="100" step="5" value="0">
          <b id="perspVal">0</b><span class="unit">%</span>
        </div>
        <div class="cam-tip">拖动即时轻量预览 · 松手补全图 · 左键上下拖也能调俯角</div>
      </div>

      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="view"></canvas>
        <div class="scale-bar" id="scaleBar" title="按世界原点处地面投影换算的线段比例尺">
          <div class="sb-track" id="sbTrack"></div>
          <div class="sb-labels"><span>0</span><span id="sbLen">5 m</span></div>
        </div>
        <div class="comp-bar" id="compBar" title="按住组件拖进画面即可落位；数量不再由配方写死"></div>
        <div class="comp-bar bld-bar" id="bldBar" title="建筑本体：点台基 / 每层 / 屋面，逐件调整；面板可拖动"></div>
        <div class="comp-panel" id="compPanel"></div>
        <div class="comp-panel bld-panel" id="bldPanel"></div>
        <div class="canvas-hint" id="hint">左键左右拖动转旋向 / 上下拖动调俯视 · 右键 / Shift 拖动平移 · 滚轮以光标为锚点缩放 · 双击复位</div>
      </div>

      <div class="stage-bottom">
        <div class="stat" id="stat"></div>
        <div class="spacer"></div>
        <div class="stat">左键旋转 / 俯视 · 右键平移 · 滚轮缩放</div>
      </div>
    </section>
  </div>

  <!-- 说明弹层 -->
    <div class="modal" id="helpModal" data-mode="build">
    <div class="modal-card" id="helpBody"></div>
  </div>

  <input type="file" id="fileInput" accept=".json" style="display:none" />

  <script src="js/gf-core.js?v=20261125classic"></script>
  <script src="js/gf-roof.js?v=20261125classic"></script>
  <script src="js/gf-parts.js?v=20261125classic"></script>
  <script src="src/ancient-build/00-common.js?v=20261125classic"></script>
  <script src="src/ancient-build/10-dwellings.js?v=20261125classic"></script>
  <script src="src/ancient-build/20-gates.js?v=20261125classic"></script>
  <script src="src/ancient-build/30-courtyard.js?v=20261125classic"></script>
  <script src="src/ancient-build/40-layout.js?v=20261125classic"></script>
  <script src="src/ancient-build/50-compounds.js?v=20261125classic"></script>
  <script src="src/ancient-build/60-garden.js?v=20261125classic"></script>
  <script src="src/ancient-build/70-city.js?v=20261125classic"></script>
  <script src="src/ancient-build/80-assembly.js?v=20261125classic"></script>
  <script src="js/gf-render.js?v=20261125classic"></script>
  <script src="js/gf-presets.js?v=20261125classic"></script>
  <script src="js/gf-export.js?v=20261125classic"></script>
  <script src="js/gf-help.js?v=20261125classic"></script>
  <script src="src/ancient-ui/00-shell.js?v=20261125classic"></script>
  <script src="src/ancient-ui/10-env-editor.js?v=20261125classic"></script>
  <script src="src/ancient-ui/20-building-editor.js?v=20261125classic"></script>
  <script src="src/ancient-ui/30-controls.js?v=20261125classic"></script>
  <script src="src/ancient-ui/40-render.js?v=20261125classic"></script>
  <script src="src/ancient-ui/50-camera.js?v=20261125classic"></script>
  <script src="src/ancient-ui/60-demo.js?v=20261125classic"></script>
  <script src="src/ancient-ui/70-grid.js?v=20261125classic"></script>
  <script src="src/ancient-ui/80-drag.js?v=20261125classic"></script>
  <script src="src/ancient-ui/90-interactions.js?v=20261125classic"></script>
  <script src="src/ancient-ui/95-export.js?v=20261125classic"></script>
  <script src="src/ancient-ui/97-events.js?v=20261125classic"></script>
  <script src="src/ancient-ui/99-boot.js?v=20261125classic"></script>
</body>
</html>
